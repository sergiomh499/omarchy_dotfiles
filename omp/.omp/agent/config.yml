providers:
  maxInFlightRequests:
    opencode-go: 6
    openrouter: 2
    perplexity: 2
    nvidia: 3
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 3
disabledProviders:
  - ollama
  - google-antigravity
  - llama.cpp
  - lm-studio
modelRoles:
  default: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/beam-free
  slow: opencode-go/deepseek-v4-pro
  plan: opencode-go/deepseek-v4-pro
  task: opencode-go/mimo-v2.6-flash
  commit: opencode-go/beam-free
  vision: opencode-go/mimo-v2-omni
  designer: opencode-go/glm-5.3-flash
  tiny: opencode-go/beam-free
  memory: opencode-go/beam-free
  judge: opencode-go/beam-free
  advisor: opencode-go/mimo-v2.6-pro
defaultThinkingLevel: auto
statusLine:
  preset: default
  separator: slash
  transparent: false
display:
  showTokenUsage: true
  shimmer: kitt
task:
  showResolvedModelBadge: true
  maxConcurrency: 3
  isolation:
    enabled: true
  agentModelOverrides:
    task: opencode-go/mimo-v2.6-flash
    scout: opencode-go/mimo-v2.6-flash
    sonic: opencode-go/beam-free
    designer: opencode-go/glm-5.3-flash
    reviewer: opencode-go/mimo-v2.6-flash
    security-reviewer: opencode-go/mimo-v2.6-flash
retry:
  enabled: true
  modelFallback: true
  baseDelayMs: 1000
  maxDelayMs: 300000
  maxRetries: 10
  fallbackOn: any
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  usageReservePct: 2
  usageReservePolicy: auto
  waitForUsageReset: false
  fallbackChains:
    opencode-go/beam-free:
      - opencode-go/mimo-v2.6-flash
      - opencode-go/mimo-v2.6-pro
    opencode-go/mimo-v2.6-flash:
      - opencode-go/beam-free
      - opencode-go/mimo-v2.6-pro
    opencode-go/mimo-v2.6-pro:
      - opencode-go/mimo-v2.6-flash
      - opencode-go/deepseek-v4-flash
    opencode-go/deepseek-v4-pro:
      - opencode-go/mimo-v2.6-pro
      - opencode-go/glm-5.3-flash
    opencode-go/glm-5.3-flash:
      - opencode-go/mimo-v2.6-flash
      - opencode-go/beam-free
memory:
  backend: hindsight
  hindsight:
    apiUrl: https://hindsight-api.homelab.local
    recallTypes:
      - world
      - experience
    recallBudget: 6
    recallMaxTokens: 1200
bash:
  gitGuard: true
skills:
  customDirectories:
    - /home/sergio/.omp/commands
exa:
  enabled: true
find:
  enabled: "on"
compaction:
  thresholdTokens: 90000
  thresholdPercent: -1
autolearn:
  enabled: true
  autoContinue: true
  minToolCalls: 8
edit:
  mode: hashline
composer:
  shape: claude
title:
  generator: tiny
checkpoint:
  enabled: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
browser:
  relay: true
dev:
  autoqaConsent: granted
astGrep:
  enabled: true
update:
  auto: true
hindsight:
  apiUrl: https://hindsight-api.homelab.local
  bankId: default